name: Issue 23 reusable workflow probe

on:
  push:
    branches:
      - issue-23-synclab-release-signing
    paths:
      - .github/workflows/issue23-reusable-probe.yml

jobs:
  probe:
    permissions:
      contents: write
      actions: read
      packages: read
    uses: Synclab-VN-dev/synclab-CICD-framework/.github/workflows/android-release-v2.yml@issue-6-public-api-signing
    with:
      configFile: synclab-release.json
      bump: d
      versionName: ""
      dryRun: true
      frameworkRef: issue-6-public-api-signing
      signingMode: public-api
      signingUrl: https://sign.synclab.com.vn
    secrets: inherit
