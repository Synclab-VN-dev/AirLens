name: AirLens Store Icon One-Shot

on:
  push:
    branches:
      - feat/airlens-play-store-icon

permissions:
  contents: write

jobs:
  generate-asset:
    if: github.repository == 'Synclab-VN-dev/AirLens'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/airlens-play-store-icon
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and test dependencies
        run: python -m pip install Pillow pytest
      - name: Generate the Play icon
        run: python tools/generate_play_store_icon.py
      - name: Commit only generated store asset to feature branch
        run: |
          git add -- android/play-store/airlens_store_icon_512.png
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "assets(android): add generated Play Store 512px icon"
            git push origin HEAD:feat/airlens-play-store-icon
          fi
      - name: Verify the Play icon
        timeout-minutes: 5
        run: python -m pytest -q tests/test_play_store_icon.py
