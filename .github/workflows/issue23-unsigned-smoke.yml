name: Issue 23 unsigned release smoke
# rerun after Gradle version parser fix

on:
  push:
    branches:
      - issue-23-synclab-release-signing
    paths:
      - .github/workflows/issue23-unsigned-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Build unsigned release APK
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android --no-daemon :app:assembleRelease
          test -f android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify APK is intentionally unsigned
        run: |
          APK=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"; then
            echo "::error::Release APK must be unsigned before Synclab signing"
            exit 1
          fi
          echo "Unsigned release APK confirmed: $APK"
