name: Phase 5 OBS E2E

on:
  push:
    branches:
      - phase-5-obs-end-to-end
  workflow_dispatch:
    inputs:
      runner_os:
        description: "Hệ điều hành máy đang chạy OBS; Windows là đường nghiệm thu chính"
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
      adb_serial:
        description: "ADB serial của T1; để trống để dùng OPENSTREAM_ANDROID_ADB_ENDPOINT"
        required: false
        type: string
      receiver_host:
        description: "IPv4 của máy OBS mà T1 truy cập được; để trống để tự lấy Tailscale IPv4"
        required: false
        type: string
      obs_log_path:
        description: "Đường dẫn log OBS hiện tại; để trống để tự tìm log mới nhất"
        required: false
        type: string
      receiver_port:
        description: "Cổng listener của nguồn OpenStream trong OBS"
        required: true
        default: "9000"
        type: string
      duration_seconds:
        description: "Thời lượng mỗi phiên phát"
        required: true
        default: "12"
        type: string
      stream_bitrate_mbps:
        description: "Bitrate E2E qua mạng; không dùng làm gate hiệu năng"
        required: true
        default: "8"
        type: string
      capability_bitrate_mbps:
        description: "Bitrate gate capability 4K30"
        required: true
        default: "30"
        type: string
      latency_ms:
        description: "SRT latency; nên khớp nguồn OBS"
        required: true
        default: "120"
        type: string

permissions:
  contents: read

jobs:
  build-android:
    name: Build app + instrumentation APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Compute Android version metadata
        id: version
        run: echo "code=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build streaming app and instrumentation APKs
        working-directory: android
        env:
          OPENSTREAM_VERSION_NAME: 1.0.1
          OPENSTREAM_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Normalize APK names
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/openstream-android.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/openstream-android-test.apk

      - name: Upload device-test APKs
        uses: actions/upload-artifact@v4
        with:
          name: phase5-device-apks
          path: dist/*.apk
          if-no-files-found: error

  obs-device-e2e-windows:
    name: Android 4K30 + mic into real OBS on Windows
    if: ${{ github.event_name == 'push' || inputs.runner_os == 'windows' }}
    needs: build-android
    runs-on: [self-hosted, windows, openstream-obs-lab]
    timeout-minutes: 20
    env:
      ADB_SERIAL_INPUT: ${{ inputs.adb_serial || vars.OPENSTREAM_ANDROID_ADB_ENDPOINT }}
      RECEIVER_HOST_INPUT: ${{ inputs.receiver_host }}
      OBS_LOG_INPUT: ${{ inputs.obs_log_path }}
      RECEIVER_PORT: ${{ inputs.receiver_port || '9000' }}
      DURATION_SECONDS: ${{ inputs.duration_seconds || '12' }}
      STREAM_BITRATE_MBPS: ${{ inputs.stream_bitrate_mbps || '8' }}
      CAPABILITY_BITRATE_MBPS: ${{ inputs.capability_bitrate_mbps || '30' }}
      LATENCY_MS: ${{ inputs.latency_ms || '120' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download app + instrumentation APKs
        uses: actions/download-artifact@v4
        with:
          name: phase5-device-apks
          path: dist

      - name: Resolve real OBS lab automatically
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Get-Command python -ErrorAction SilentlyContinue)) { throw 'python is not on PATH' }
          if (!(Get-Command adb -ErrorAction SilentlyContinue)) { throw 'adb is not on PATH' }
          if ([string]::IsNullOrWhiteSpace($env:ADB_SERIAL_INPUT)) {
            throw 'Missing ADB serial. Configure repository variable OPENSTREAM_ANDROID_ADB_ENDPOINT or dispatch with adb_serial.'
          }

          adb connect $env:ADB_SERIAL_INPUT | Write-Host
          $state = (adb -s $env:ADB_SERIAL_INPUT get-state 2>$null).Trim()
          if ($state -ne 'device') { throw "ADB device is not online: $env:ADB_SERIAL_INPUT ($state)" }

          $receiverHost = $env:RECEIVER_HOST_INPUT
          if ([string]::IsNullOrWhiteSpace($receiverHost)) {
            if (!(Get-Command tailscale -ErrorAction SilentlyContinue)) {
              throw 'receiver_host was not provided and tailscale is not on PATH'
            }
            $receiverHost = ((tailscale ip -4) | Select-Object -First 1).Trim()
          }
          if ([string]::IsNullOrWhiteSpace($receiverHost)) { throw 'Could not resolve receiver host' }

          $obs = Get-Process -Name obs64,obs -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$obs) { throw 'OBS Studio is not running on the Windows lab' }

          $obsLog = $env:OBS_LOG_INPUT
          if ([string]::IsNullOrWhiteSpace($obsLog)) {
            $logRoot = Join-Path $env:APPDATA 'obs-studio\logs'
            $latest = Get-ChildItem -LiteralPath $logRoot -Filter '*.txt' -File -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 1
            if (!$latest) { throw "No OBS log found under $logRoot" }
            $obsLog = $latest.FullName
          }
          if (!(Test-Path -LiteralPath $obsLog)) { throw "OBS log does not exist: $obsLog" }

          python -m py_compile tools/phase5_obs_e2e.py
          "PHASE5_ADB_SERIAL=$env:ADB_SERIAL_INPUT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PHASE5_RECEIVER_HOST=$receiverHost" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PHASE5_OBS_LOG=$obsLog" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Device: $(adb -s $env:ADB_SERIAL_INPUT shell getprop ro.product.model)"
          Write-Host "Receiver host: $receiverHost"
          Write-Host "OBS PID: $($obs.Id)"
          Write-Host "OBS log: $obsLog"

      - name: Run Phase 5 functional acceptance
        shell: powershell
        run: |
          python tools/phase5_obs_e2e.py `
            --adb-serial "$env:PHASE5_ADB_SERIAL" `
            --receiver-host "$env:PHASE5_RECEIVER_HOST" `
            --obs-log "$env:PHASE5_OBS_LOG" `
            --app-apk dist/openstream-android.apk `
            --test-apk dist/openstream-android-test.apk `
            --receiver-port "$env:RECEIVER_PORT" `
            --duration-seconds "$env:DURATION_SECONDS" `
            --stream-bitrate-mbps "$env:STREAM_BITRATE_MBPS" `
            --capability-bitrate-mbps "$env:CAPABILITY_BITRATE_MBPS" `
            --latency-ms "$env:LATENCY_MS" `
            --evidence-dir build/phase5-obs-e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stop test app
        if: always()
        shell: powershell
        run: |
          if ($env:PHASE5_ADB_SERIAL) {
            adb -s "$env:PHASE5_ADB_SERIAL" shell am force-stop dev.openstream.app
          }
        continue-on-error: true

      - name: Upload Phase 5 OBS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-obs-e2e-evidence-windows
          path: build/phase5-obs-e2e
          if-no-files-found: warn

  obs-device-e2e-linux:
    name: Android 4K30 + mic into real OBS on Linux
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_os == 'linux' }}
    needs: build-android
    runs-on: [self-hosted, linux, openstream-obs-lab]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download app + instrumentation APKs
        uses: actions/download-artifact@v4
        with:
          name: phase5-device-apks
          path: dist

      - name: Verify OBS lab prerequisites
        run: |
          set -euo pipefail
          command -v python3
          command -v adb
          test -f "${{ inputs.obs_log_path }}"
          python3 -m py_compile tools/phase5_obs_e2e.py

      - name: Run Phase 5 OBS acceptance
        run: |
          set -euo pipefail
          python3 tools/phase5_obs_e2e.py \
            --adb-serial "${{ inputs.adb_serial }}" \
            --receiver-host "${{ inputs.receiver_host }}" \
            --obs-log "${{ inputs.obs_log_path }}" \
            --app-apk dist/openstream-android.apk \
            --test-apk dist/openstream-android-test.apk \
            --receiver-port "${{ inputs.receiver_port }}" \
            --duration-seconds "${{ inputs.duration_seconds }}" \
            --stream-bitrate-mbps "${{ inputs.stream_bitrate_mbps }}" \
            --capability-bitrate-mbps "${{ inputs.capability_bitrate_mbps }}" \
            --latency-ms "${{ inputs.latency_ms }}" \
            --evidence-dir build/phase5-obs-e2e

      - name: Stop test app
        if: always()
        run: adb -s "${{ inputs.adb_serial }}" shell am force-stop dev.openstream.app || true

      - name: Upload Phase 5 OBS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-obs-e2e-evidence-linux
          path: build/phase5-obs-e2e
          if-no-files-found: warn
