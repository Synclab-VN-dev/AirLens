name: Phase 5 OBS E2E

on:
  workflow_dispatch:
    inputs:
      runner_os:
        description: "Hệ điều hành máy đang chạy OBS; Windows là đường nghiệm thu chính"
        required: true
        default: windows
        type: choice
        options:
          - windows
          - linux
      adb_serial:
        description: "ADB serial của T1, ví dụ 100.x.y.z:5555"
        required: true
        type: string
      receiver_host:
        description: "IPv4 của máy OBS mà T1 truy cập được"
        required: true
        type: string
      obs_log_path:
        description: "Đường dẫn tuyệt đối tới log hiện tại của OBS trên runner"
        required: true
        type: string
      receiver_port:
        description: "Cổng listener của nguồn OpenStream trong OBS"
        required: true
        default: "9000"
        type: string
      duration_seconds:
        description: "Thời lượng mỗi phiên phát"
        required: true
        default: "12"
        type: string
      stream_bitrate_mbps:
        description: "Bitrate E2E qua mạng"
        required: true
        default: "8"
        type: string
      capability_bitrate_mbps:
        description: "Bitrate gate capability 4K30"
        required: true
        default: "30"
        type: string
      latency_ms:
        description: "SRT latency; nên khớp nguồn OBS"
        required: true
        default: "120"
        type: string

permissions:
  contents: read

jobs:
  build-android:
    name: Build app + instrumentation APKs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Compute Android version metadata
        id: version
        run: echo "code=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build streaming app and instrumentation APKs
        working-directory: android
        env:
          OPENSTREAM_VERSION_NAME: 1.0.1
          OPENSTREAM_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Normalize APK names
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/openstream-android.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/openstream-android-test.apk

      - name: Upload device-test APKs
        uses: actions/upload-artifact@v4
        with:
          name: phase5-device-apks
          path: dist/*.apk
          if-no-files-found: error

  obs-device-e2e-windows:
    name: Android 4K30 + mic into real OBS on Windows
    if: ${{ inputs.runner_os == 'windows' }}
    needs: build-android
    runs-on: [self-hosted, windows, openstream-obs-lab]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download app + instrumentation APKs
        uses: actions/download-artifact@v4
        with:
          name: phase5-device-apks
          path: dist

      - name: Verify OBS lab prerequisites
        shell: powershell
        run: |
          if (!(Get-Command python -ErrorAction SilentlyContinue)) { throw "python is not on PATH" }
          if (!(Get-Command adb -ErrorAction SilentlyContinue)) { throw "adb is not on PATH" }
          if (!(Test-Path -LiteralPath '${{ inputs.obs_log_path }}')) { throw "OBS log does not exist" }
          python -m py_compile tools/phase5_obs_e2e.py

      - name: Run Phase 5 OBS acceptance
        shell: powershell
        run: |
          python tools/phase5_obs_e2e.py `
            --adb-serial '${{ inputs.adb_serial }}' `
            --receiver-host '${{ inputs.receiver_host }}' `
            --obs-log '${{ inputs.obs_log_path }}' `
            --app-apk dist/openstream-android.apk `
            --test-apk dist/openstream-android-test.apk `
            --receiver-port '${{ inputs.receiver_port }}' `
            --duration-seconds '${{ inputs.duration_seconds }}' `
            --stream-bitrate-mbps '${{ inputs.stream_bitrate_mbps }}' `
            --capability-bitrate-mbps '${{ inputs.capability_bitrate_mbps }}' `
            --latency-ms '${{ inputs.latency_ms }}' `
            --evidence-dir build/phase5-obs-e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stop test app
        if: always()
        shell: powershell
        run: adb -s '${{ inputs.adb_serial }}' shell am force-stop dev.openstream.app
        continue-on-error: true

      - name: Upload Phase 5 OBS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-obs-e2e-evidence-windows
          path: build/phase5-obs-e2e
          if-no-files-found: warn

  obs-device-e2e-linux:
    name: Android 4K30 + mic into real OBS on Linux
    if: ${{ inputs.runner_os == 'linux' }}
    needs: build-android
    runs-on: [self-hosted, linux, openstream-obs-lab]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download app + instrumentation APKs
        uses: actions/download-artifact@v4
        with:
          name: phase5-device-apks
          path: dist

      - name: Verify OBS lab prerequisites
        run: |
          set -euo pipefail
          command -v python3
          command -v adb
          test -f "${{ inputs.obs_log_path }}"
          python3 -m py_compile tools/phase5_obs_e2e.py

      - name: Run Phase 5 OBS acceptance
        run: |
          set -euo pipefail
          python3 tools/phase5_obs_e2e.py \
            --adb-serial "${{ inputs.adb_serial }}" \
            --receiver-host "${{ inputs.receiver_host }}" \
            --obs-log "${{ inputs.obs_log_path }}" \
            --app-apk dist/openstream-android.apk \
            --test-apk dist/openstream-android-test.apk \
            --receiver-port "${{ inputs.receiver_port }}" \
            --duration-seconds "${{ inputs.duration_seconds }}" \
            --stream-bitrate-mbps "${{ inputs.stream_bitrate_mbps }}" \
            --capability-bitrate-mbps "${{ inputs.capability_bitrate_mbps }}" \
            --latency-ms "${{ inputs.latency_ms }}" \
            --evidence-dir build/phase5-obs-e2e

      - name: Stop test app
        if: always()
        run: adb -s "${{ inputs.adb_serial }}" shell am force-stop dev.openstream.app || true

      - name: Upload Phase 5 OBS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-obs-e2e-evidence-linux
          path: build/phase5-obs-e2e
          if-no-files-found: warn
