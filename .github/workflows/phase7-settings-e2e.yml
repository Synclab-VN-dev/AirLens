name: Phase 7 Settings E2E

on:
  push:
    branches:
      - phase-7-larix-ux-release
  workflow_dispatch:
    inputs:
      adb_serial:
        description: "ADB serial override; để trống để dùng OPENSTREAM_ANDROID_ADB_ENDPOINT hoặc đúng 1 device đã kết nối"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: phase7-settings-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build app + Phase 7 instrumentation APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Compute Android version metadata
        id: version
        run: echo "code=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Run tests, lint, and build device APKs
        env:
          OPENSTREAM_VERSION_NAME: 1.0.1
          OPENSTREAM_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Normalize device APKs
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/openstream-android.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/openstream-android-test.apk

      - name: Upload device APKs
        uses: actions/upload-artifact@v4
        with:
          name: phase7-device-apks
          path: dist/*.apk
          if-no-files-found: error

  settings-device-e2e:
    name: Profiles, presets, validation, and capability UI on real Android
    needs: build-android
    runs-on: [self-hosted, linux, openstream-device-lab]
    timeout-minutes: 20
    env:
      ADB_SERIAL_CONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.adb_serial || vars.OPENSTREAM_ANDROID_ADB_ENDPOINT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download device APKs
        uses: actions/download-artifact@v4
        with:
          name: phase7-device-apks
          path: dist

      - name: Resolve Android device
        id: device
        shell: bash
        run: |
          set -euo pipefail
          command -v adb
          adb_serial="$ADB_SERIAL_CONFIG"
          if [[ -n "$adb_serial" ]]; then
            adb connect "$adb_serial" || true
            adb -s "$adb_serial" wait-for-device
            [[ "$(adb -s "$adb_serial" get-state)" == "device" ]]
          else
            mapfile -t devices < <(adb devices | awk 'NR>1 && $2=="device" {print $1}')
            if [[ ${#devices[@]} -ne 1 ]]; then
              echo "Cần đúng 1 ADB device khi không có adb_serial; hiện có ${#devices[@]}" >&2
              printf '%s\n' "${devices[@]}" >&2
              exit 1
            fi
            adb_serial="${devices[0]}"
          fi
          echo "adb_serial=$adb_serial" >> "$GITHUB_OUTPUT"
          echo "ADB target: $adb_serial"
          echo "Scope: functional UI/profile/preset evidence only; no LAN discovery/performance acceptance"

      - name: Install app and instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          serial='${{ steps.device.outputs.adb_serial }}'
          if ! adb -s "$serial" install -r -t dist/openstream-android.apk; then
            adb -s "$serial" uninstall dev.openstream.app || true
            adb -s "$serial" install -r -t dist/openstream-android.apk
          fi
          if ! adb -s "$serial" install -r -t dist/openstream-android-test.apk; then
            adb -s "$serial" uninstall dev.openstream.app.test || true
            adb -s "$serial" install -r -t dist/openstream-android-test.apk
          fi
          adb -s "$serial" shell pm grant dev.openstream.app android.permission.CAMERA
          adb -s "$serial" shell pm grant dev.openstream.app android.permission.RECORD_AUDIO

      - name: Run Phase 7 settings instrumentation
        shell: bash
        run: |
          set -euo pipefail
          serial='${{ steps.device.outputs.adb_serial }}'
          mkdir -p build/phase7-settings-e2e
          set +e
          adb -s "$serial" shell am instrument -w -r \
            -e class dev.openstream.app.Phase7SettingsE2eTest \
            dev.openstream.app.test/androidx.test.runner.AndroidJUnitRunner \
            | tee build/phase7-settings-e2e/instrumentation.txt
          status=${PIPESTATUS[0]}
          set -e
          [[ $status -eq 0 ]]
          grep -q 'OK (1 test)' build/phase7-settings-e2e/instrumentation.txt

      - name: Record device context
        if: always()
        shell: bash
        run: |
          mkdir -p build/phase7-settings-e2e
          serial='${{ steps.device.outputs.adb_serial }}'
          {
            echo "adb_serial=$serial"
            echo "remote_transport=functional-only"
            echo "production_lan_acceptance=false"
            echo "deferred=P7-TC09,P7-TC10,P7-TC11,P7-TC12-walkthrough,P7-TC13"
          } > build/phase7-settings-e2e/context.txt
          adb -s "$serial" shell getprop ro.build.version.release > build/phase7-settings-e2e/android-version.txt 2>&1 || true
          adb -s "$serial" shell getprop ro.product.model > build/phase7-settings-e2e/device-model.txt 2>&1 || true

      - name: Stop test app
        if: always()
        run: adb -s '${{ steps.device.outputs.adb_serial }}' shell am force-stop dev.openstream.app || true

      - name: Upload Phase 7 settings evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-settings-e2e-evidence
          path: build/phase7-settings-e2e
          if-no-files-found: warn
