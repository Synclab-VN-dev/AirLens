name: Release
# E2E rerun after public framework secret contract fix

on:
  push:
    branches:
      - issue-23-synclab-release-signing
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        default: d
        type: choice
        options:
          - d
          - c
          - b
          - a
      versionName:
        description: Optional explicit a.b.c.d version
        required: false
        default: ""
        type: string
      dryRun:
        description: Build, sign and verify without publishing GitHub Release
        required: true
        default: true
        type: boolean

jobs:
  android-release:
    permissions:
      contents: write
      actions: read
      packages: read
    uses: Synclab-VN-dev/synclab-CICD-framework/.github/workflows/android-release.yml@issue-6-public-api-signing
    with:
      configFile: synclab-release.json
      bump: ${{ inputs.bump }}
      versionName: ${{ inputs.versionName }}
      dryRun: ${{ inputs.dryRun }}
      frameworkRef: issue-6-public-api-signing
      signingMode: public-api
      signingUrl: https://sign.synclab.com.vn
    secrets: inherit
