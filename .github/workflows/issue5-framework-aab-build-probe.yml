name: Issue 5 Framework AAB Build Probe
# M3/M4 PROD production acceptance

on:
  push:
    branches:
      - issue-5-google-play-aab
    paths:
      - .github/workflows/issue5-framework-aab-build-probe.yml

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AirLens
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android build packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.0.13004108"

      - name: Check out AAB-capable framework
        uses: actions/checkout@v4
        with:
          repository: Synclab-VN-dev/synclab-CICD-framework
          ref: issue-5-aab-artifacts
          path: .synclab-cicd-framework

      - name: Prepare release plan
        uses: ./.synclab-cicd-framework
        with:
          command: prepare
          config-file: synclab-release.json
          bump: d
          dry-run: true

      - name: Build staged Android artifacts
        uses: ./.synclab-cicd-framework
        with:
          command: build
          plan-file: synclab-release-plan/release-plan.json
          output-dir: synclab-unsigned-artifacts

      - name: Verify staged APK and AAB
        run: |
          set -euo pipefail
          test -s synclab-unsigned-artifacts/release.apk
          test -s synclab-unsigned-artifacts/play.aab
          python - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("synclab-release-plan/release-plan.json").read_text())
          assert plan["versionName"] == "18.0.0.1"
          assert plan["versionCode"] == 1800000001
          targets = {item["name"]: item for item in plan["targets"]}
          assert targets["release"]["artifactType"] == "apk"
          assert targets["play"]["artifactType"] == "aab"
          print("Framework staged build produced release.apk + play.aab for 18.0.0.1")
          PY

      - name: Upload probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: issue5-framework-aab-build-probe
          path: |
            synclab-release-plan/release-plan.json
            synclab-unsigned-artifacts/release.apk
            synclab-unsigned-artifacts/play.aab
          if-no-files-found: error

      - name: Dispatch full Release consumer dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref issue-5-google-play-aab -f bump=d -f dryRun=true

      - name: Wait for dispatched Release run
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh run list --workflow release.yml --branch issue-5-google-play-aab --event workflow_dispatch --limit 10 --json databaseId,headSha --jq '.[] | select(.headSha=="'${GITHUB_SHA}'") | .databaseId' | head -n1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --exit-status

      - name: Download production Release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id="${{ steps.release.outputs.run_id }}"
          rm -rf m3-evidence
          mkdir -p m3-evidence/{unsigned,signed,final,plan}
          gh run download "$run_id" -n unsigned-apks -D m3-evidence/unsigned
          gh run download "$run_id" -n signed-apks -D m3-evidence/signed
          gh run download "$run_id" -n final-artifacts -D m3-evidence/final
          gh run download "$run_id" -n release-plan -D m3-evidence/plan

      - name: Verify PROD AAB artifact evidence
        run: |
          set -euo pipefail
          test -s m3-evidence/unsigned/play.aab
          test -s m3-evidence/signed/play-signed.aab

          unsigned_sha="$(sha256sum m3-evidence/unsigned/play.aab | awk '{print $1}')"
          signed_sha="$(sha256sum m3-evidence/signed/play-signed.aab | awk '{print $1}')"
          test "$unsigned_sha" != "$signed_sha"

          jarsigner -verify m3-evidence/signed/play-signed.aab 2>&1 | tee m3-evidence/aab-jarsigner.txt
          grep -qi "jar verified" m3-evidence/aab-jarsigner.txt

          cert_output="$(keytool -printcert -jarfile m3-evidence/signed/play-signed.aab)"
          printf '%s\n' "$cert_output" | tee m3-evidence/aab-cert.txt
          actual_fp="$(printf '%s\n' "$cert_output" | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test "$actual_fp" = "8D1C1E8F11CCAE7E8B4F2035F5687E2DD360346E20806A9F7D09A6ABC6A8794D"
          test "$actual_fp" != "1E7CABC46DA107BBA259DD78E1D521E9A3BFF62A94430FE9A4AB9292649D237D"

          test -n "$(find m3-evidence/final -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$(find m3-evidence/final -maxdepth 1 -type f -name '*.aab' -print -quit)"
          (
            cd m3-evidence/final
            sha256sum -c checksum.sha256
          )
          jq -e '[.artifacts[].artifactType] | sort == ["aab","apk"]' m3-evidence/final/metadata.json

          printf 'unsigned_aab_sha256=%s\n' "$unsigned_sha"
          printf 'signed_aab_sha256=%s\n' "$signed_sha"
          printf 'prod_signer_sha256=%s\n' "$actual_fp"

      - name: Verify PROD signing audit matches artifacts
        env:
          SYNCLAB_SIGNING_API_KEY_PROD: ${{ secrets.SYNCLAB_SIGNING_API_KEY_PROD }}
        run: |
          set -euo pipefail
          test -n "${SYNCLAB_SIGNING_API_KEY_PROD:-}"

          unsigned_aab_sha="$(sha256sum m3-evidence/unsigned/play.aab | awk '{print $1}')"
          signed_aab_sha="$(sha256sum m3-evidence/signed/play-signed.aab | awk '{print $1}')"
          unsigned_apk_sha="$(sha256sum m3-evidence/unsigned/release.apk | awk '{print $1}')"
          signed_apk_sha="$(sha256sum m3-evidence/signed/release-signed.apk | awk '{print $1}')"

          audit="$(curl -fsS \
            -H "X-Synclab-Api-Key: $SYNCLAB_SIGNING_API_KEY_PROD" \
            "https://sign.synclab.com.vn/v1/audit/recent?limit=100")"

          aab_item="$(printf '%s' "$audit" | jq -c \
            --arg input "$unsigned_aab_sha" --arg output "$signed_aab_sha" '
              .items[]
              | select(.artifact_type=="aab")
              | select(.profile=="prod")
              | select(.result=="success")
              | select(.input_sha256==$input)
              | select(.output_sha256==$output)
            ' | head -n1)"
          test -n "$aab_item"

          apk_item="$(printf '%s' "$audit" | jq -c \
            --arg input "$unsigned_apk_sha" --arg output "$signed_apk_sha" '
              .items[]
              | select(.artifact_type=="apk")
              | select(.profile=="prod")
              | select(.result=="success")
              | select(.input_sha256==$input)
              | select(.output_sha256==$output)
            ' | head -n1)"
          test -n "$apk_item"

          printf '%s\n' "$aab_item" | jq '{request_id,ts,api_key_name,profile,artifact_type,input_sha256,output_sha256,result}'
          printf '%s\n' "$apk_item" | jq '{request_id,ts,api_key_name,profile,artifact_type,input_sha256,output_sha256,result}'
