name: Patch PR25 SRT timeout

on:
  push:
    branches:
      - fix/obs-media-clock-stale-black-screen

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove forced SRT read timeout
        shell: python
        run: |
          from pathlib import Path
          path = Path('obs-plugin/src/openstream-source.cpp')
          text = path.read_text(encoding='utf-8')
          old_const = "constexpr int64_t kSrtIoTimeoutUs = 4'500'000;\n"
          old_option = '    av_dict_set_int(&options, "timeout", kSrtIoTimeoutUs, 0);\n'
          if text.count(old_const) != 1 or text.count(old_option) != 1:
              raise SystemExit('Expected exactly one SRT timeout constant and one timeout option')
          text = text.replace(old_const, '', 1).replace(old_option, '', 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify patch
        shell: bash
        run: |
          ! grep -q 'kSrtIoTimeoutUs' obs-plugin/src/openstream-source.cpp
          ! grep -q 'av_dict_set_int(&options, "timeout"' obs-plugin/src/openstream-source.cpp
          grep -q 'av_dict_set_int(&options, "connect_timeout", kSrtConnectTimeoutMs, 0);' obs-plugin/src/openstream-source.cpp
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add obs-plugin/src/openstream-source.cpp
          git commit -m "Remove forced SRT read timeout"
          git push origin HEAD:${GITHUB_REF_NAME}
